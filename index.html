<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Kasir Toko Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <!-- Header / Navbar -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fas fa-cash-register text-2xl"></i>
        <h1 id="headerTokoTitle" class="text-xl font-bold">POS Kasir Toko Pro</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="roleBadge" class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-800 text-indigo-100">
          Owner
        </span>
        <div id="driveStatus" class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-500 text-indigo-100 flex items-center gap-1">
          <i class="fas fa-times-circle"></i> Belum Terhubung
        </div>
        <button id="btnConnectDrive" onclick="handleAuthClick()" class="bg-indigo-800 hover:bg-indigo-900 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1 transition">
          <i class="fab fa-google-drive"></i> Connect Drive
        </button>
        <button onclick="openLoginModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 text-xs px-3 py-1.5 rounded font-bold flex items-center gap-1 transition">
          <i class="fas fa-user-shield"></i> Switch Role / PIN
        </button>
      </div>
    </div>
  </header>

  <!-- Container Utama -->
  <div class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Kolom Kiri: Produk & Katalog -->
    <div class="md:col-span-2 space-y-4">
      <div class="bg-white p-4 rounded-lg shadow-sm border flex justify-between items-center gap-4">
        <input type="text" id="searchProduct" onkeyup="renderProducts()" placeholder="Cari nama produk..." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        <select id="filterCategory" onchange="renderProducts()" class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <option value="All">Semua Kategori</option>
          <option value="Makanan">Makanan</option>
          <option value="Minuman">Minuman</option>
          <option value="Snack">Snack</option>
          <option value="Sembako">Sembako</option>
        </select>
      </div>

      <!-- Grid Produk -->
      <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Card Produk Di-render via JS -->
      </div>
    </div>

    <!-- Kolom Kanan: Keranjang & Kasir -->
    <div class="bg-white p-4 rounded-lg shadow-sm border flex flex-col justify-between h-[calc(100vh-120px)] sticky top-20">
      <div>
        <h2 class="text-lg font-bold border-b pb-2 mb-3 flex justify-between items-center">
          <span><i class="fas fa-shopping-cart text-indigo-600"></i> Keranjang</span>
          <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Kosongkan</button>
        </h2>
        <div id="cartItems" class="space-y-3 overflow-y-auto max-h-[300px] pr-1">
          <!-- Item Keranjang Di-render via JS -->
        </div>
      </div>

      <div class="border-t pt-3 space-y-2 bg-gray-50 p-3 rounded-lg">
        <div class="flex justify-between text-sm">
          <span class="text-gray-600">Total:</span>
          <span id="cartTotal" class="font-bold text-lg text-indigo-600">Rp 0</span>
        </div>
        <div class="space-y-1">
          <label class="text-xs text-gray-500">Jumlah Bayar (Rp):</label>
          <input type="number" id="payAmount" oninput="calculateChange()" placeholder="0" class="w-full border rounded px-3 py-1.5 text-sm font-semibold">
        </div>
        <div class="flex justify-between text-xs text-gray-600">
          <span>Kembalian:</span>
          <span id="changeAmount" class="font-bold text-green-600">Rp 0</span>
        </div>
        <button onclick="processCheckout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-sm transition mt-2">
          <i class="fas fa-print"></i> Proses & Cetak Struk
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Login / Switch Role -->
  <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
      <h3 class="text-lg font-bold text-gray-800 border-b pb-2"><i class="fas fa-lock text-indigo-600"></i> Masuk / Ganti Role</h3>
      
      <div>
        <label class="text-xs font-semibold text-gray-600 mb-1 block">Pilih Role Access:</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btnRoleOwner" onclick="selectRole('Owner')" class="py-2 text-sm font-bold rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-600 flex items-center justify-center gap-2">
            <i class="fas fa-user-shield"></i> Owner
          </button>
          <button type="button" id="btnRoleKaryawan" onclick="selectRole('Karyawan')" class="py-2 text-sm font-bold rounded-lg border-2 border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-2">
            <i class="fas fa-user"></i> Karyawan
          </button>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600 mb-1 block">Masukkan PIN Security:</label>
        <input type="password" id="inputPin" placeholder="Masukkan PIN" class="w-full border rounded-lg px-3 py-2 text-center text-lg tracking-widest focus:outline-none focus:border-indigo-500">
        <p class="text-[10px] text-gray-400 mt-1">*Default PIN Owner: 1234 | Karyawan: 0000</p>
      </div>

      <div class="flex gap-2">
        <button onclick="closeLoginModal()" class="w-1/2 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-xs font-bold">Batal</button>
        <button onclick="submitLogin()" class="w-1/2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold">Verifikasi</button>
      </div>
    </div>
  </div>

  <!-- Javascript Logic -->
  <script>
    // ==========================================
    // 1. KONFIGURASI CLIENT ID GOOGLE DRIVE
    // ==========================================
    const CLIENT_ID = '141076155796-vq896v2utrs0ci35caascubo66fo2vuc.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    const FILE_NAME = 'pos_toko_data.json';

    let tokenClient, gapiInited = false, ggisInited = false;
    let accessToken = null, driveFileId = null;

    // Data Store Aplikasi
    let currentRole = 'Owner';
    let selectedModalRole = 'Owner';
    let ownerPin = '1234';
    let karyawanPin = '0000';

    let products = [
      { id: 1, name: 'Kopi Hitam', category: 'Minuman', price: 5000, stock: 50 },
      { id: 2, name: 'Nasi Goreng', category: 'Makanan', price: 15000, stock: 30 },
      { id: 3, name: 'Keripik Singkong', category: 'Snack', price: 8000, stock: 20 },
    ];
    let cart = [];

    // --- LOGIK SWAP ROLE / LOGIN ---
    function openLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
      selectRole(currentRole);
      document.getElementById('inputPin').value = '';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function selectRole(role) {
      selectedModalRole = role;
      const btnOwner = document.getElementById('btnRoleOwner');
      const btnKaryawan = document.getElementById('btnRoleKaryawan');

      if (role === 'Owner') {
        btnOwner.className = 'py-2 text-sm font-bold rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-600 flex items-center justify-center gap-2';
        btnKaryawan.className = 'py-2 text-sm font-bold rounded-lg border-2 border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-2';
      } else {
        btnKaryawan.className = 'py-2 text-sm font-bold rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-600 flex items-center justify-center gap-2';
        btnOwner.className = 'py-2 text-sm font-bold rounded-lg border-2 border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-2';
      }
    }

    function submitLogin() {
      const pin = document.getElementById('inputPin').value;
      if (selectedModalRole === 'Owner' && pin === ownerPin) {
        currentRole = 'Owner';
        alert('Berhasil Login sebagai Owner!');
      } else if (selectedModalRole === 'Karyawan' && pin === karyawanPin) {
        currentRole = 'Karyawan';
        alert('Berhasil Login sebagai Karyawan!');
      } else {
        alert('PIN Salah! Silakan coba lagi.');
        return;
      }

      document.getElementById('roleBadge').innerText = currentRole;
      closeLoginModal();
    }

    // --- POS ENGINE ---
    function renderProducts() {
      const search = document.getElementById('searchProduct').value.toLowerCase();
      const cat = document.getElementById('filterCategory').value;
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search);
        const matchCat = cat === 'All' || p.category === cat;
        return matchSearch && matchCat;
      }).forEach(p => {
        grid.innerHTML += `
          <div onclick="addToCart(${p.id})" class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
            <div class="text-xs text-indigo-600 font-semibold mb-1">${p.category}</div>
            <div class="font-bold text-sm text-gray-800">${p.name}</div>
            <div class="text-xs text-gray-500 mt-1">Stok: ${p.stock}</div>
            <div class="font-bold text-indigo-600 mt-2">Rp ${p.price.toLocaleString()}</div>
          </div>
        `;
      });
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (!prod || prod.stock <= 0) return alert('Stok habis!');
      const item = cart.find(c => c.id === id);
      if (item) {
        if (item.qty < prod.stock) item.qty++;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const sub = item.price * item.qty;
        total += sub;
        container.innerHTML += `
          <div class="flex justify-between items-center text-xs border-b pb-2">
            <div>
              <div class="font-bold">${item.name}</div>
              <div class="text-gray-500">Rp ${item.price.toLocaleString()} x ${item.qty}</div>
            </div>
            <div class="font-bold text-indigo-600">Rp ${sub.toLocaleString()}</div>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString()}`;
      calculateChange();
    }

    function calculateChange() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const pay = parseFloat(document.getElementById('payAmount').value) || 0;
      const change = pay - total;
      document.getElementById('changeAmount').innerText = `Rp ${change > 0 ? change.toLocaleString() : 0}`;
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function processCheckout() {
      if (cart.length === 0) return alert('Keranjang belanja masih kosong!');
      alert('Transaksi Berhasil! Struk siap dicetak.');
      clearCart();
      document.getElementById('payAmount').value = '';
    }

    // --- GOOGLE DRIVE LOGIC ---
    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({});
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) return;
          accessToken = resp.access_token;
          document.getElementById('driveStatus').className = 'text-xs font-semibold px-2.5 py-1 rounded bg-green-500 text-white flex items-center gap-1';
          document.getElementById('driveStatus').innerHTML = '<i class="fas fa-check-circle"></i> Terhubung ke Drive';
        },
      });
      ggisInited = true;
    }

    function handleAuthClick() {
      if (!CLIENT_ID || CLIENT_ID.includes('MASUKKAN_GOOGLE_CLIENT_ID')) {
        alert('Harap masukkan Google Client ID Anda pada kode HTML terlebih dahulu!');
        return;
      }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    // Init
    renderProducts();
  </script>

  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
